<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Lab 5 — Kształty</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="topbar">
        <h1>Kształty</h1>
      </header>

      <section class="controls">
        <div class="controls__group">
          <button id="add-square" class="btn">Dodaj kwadrat</button>
          <button id="add-circle" class="btn">Dodaj kółko</button>
        </div>
        <div class="controls__group">
          <button id="recolor-squares" class="btn">Koloruj kwadraty</button>
          <button id="recolor-circles" class="btn">Koloruj kółka</button>
        </div>
        <div class="controls__group counters">
          <span>Kwadraty: <strong id="count-squares">0</strong></span>
          <span>Kółka: <strong id="count-circles">0</strong></span>
          <span>Razem: <strong id="count-all">0</strong></span>
        </div>
      </section>

      <section class="board">
        <h2 class="board__title">Kliknij w kształt, żeby go usunąć</h2>
        <div id="shape-list" class="shape-list"></div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
